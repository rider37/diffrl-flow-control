[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffrl-flow-control"
version = "1.0.0"
description = "Differentiable incompressible Navier-Stokes solver in JAX and SHAC/PPO active-flow-control benchmarks"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Jiwon Kang"},
    {name = "Innyoung Kim"},
    {name = "Sangseung Lee"},
]
dependencies = [
    "jax>=0.9.2",
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
